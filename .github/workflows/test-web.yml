name: Tester le jeu web
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-web.yml'
      - 'web/**'
      - 'tests/**'
  workflow_run:
    workflows: [Compiler et publier le jeu web]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: Build run containing the oot-web-site artifact
        required: true
permissions:
  contents: write
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  smoke:
    # A build may have produced the artifact even if its legacy deploy step failed.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Choisir le moteur déjà compilé
        id: engine
        uses: actions/github-script@v7
        with:
          script: |
            let runId = context.payload.inputs?.run_id || context.payload.workflow_run?.id;
            if (!runId) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                ...context.repo, workflow_id: 'build-web.yml', branch: 'main',
                status: 'success', per_page: 1
              });
              runId = data.workflow_runs[0]?.id;
            }
            if (!runId) throw new Error('Aucune compilation réussie disponible');
            core.setOutput('run_id', String(runId));
            core.info('Moteur issu de la compilation ' + runId);
      - uses: actions/download-artifact@v4
        with:
          name: oot-web-site
          path: site
          run-id: ${{ steps.engine.outputs.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Corriger le chargement avant les tests
        run: |
          # Release Emscripten minifies the shell's inline JavaScript. Recreate
          # the readable shell from the same pinned source before patching it.
          mkdir -p loader-source/soh/soh/web
          curl --fail --show-error --location --retry 3 \
            https://raw.githubusercontent.com/zalo/Shipwright/f81ff64afdd8e0489237bd03c6b026582f6dc70d/soh/soh/web/shell.html \
            -o loader-source/soh/soh/web/shell.html
          echo '925bfc59191cab7056dc44ce83f4872c9980ce354e1e8306fec82513f833671f  loader-source/soh/soh/web/shell.html' | sha256sum -c -
          git -C loader-source init -q
          git -C loader-source apply --include=soh/soh/web/shell.html "$GITHUB_WORKSPACE/patches/web-mobile-perf.patch"
          node web/fix-loader.cjs site/index.html loader-source/soh/soh/web/shell.html
      - name: Installer les navigateurs de test
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1 jsdom@26.1.0 fake-indexeddb@6.2.4
          npx playwright install --with-deps chromium webkit
      - name: Tester les cas limites du chargeur
        run: node tests/loader.cjs site/index.html
      - name: Tester le chargement sans ROM
        run: node tests/web-smoke.cjs site
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oot-web-browser-reports
          path: web-test-reports
          retention-days: 14
      - name: Recalculer les empreintes après correction du chargeur
        run: |
          rm -f site/SHA256SUMS.txt
          sha256sum site/* > site/SHA256SUMS.txt
      - name: Conserver durablement le site vérifié sur web-build
        env:
          BUILD_RUN_ID: ${{ steps.engine.outputs.run_id }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin web-build; then
            git fetch origin web-build
            git worktree add --detach site-publish FETCH_HEAD
          else
            git worktree add --detach site-publish HEAD
            git -C site-publish switch --orphan web-build
          fi
          for file in index.html soh.js soh.wasm soh.data soh.o2r SHA256SUMS.txt; do
            cp "site/$file" "site-publish/$file"
            git -C site-publish add -f "$file"
          done
          touch site-publish/.nojekyll
          git -C site-publish add .nojekyll
          if ! git -C site-publish diff --cached --quiet; then
            git -C site-publish commit -m "Publish tested engine from build $BUILD_RUN_ID (loader $GITHUB_SHA)"
            git -C site-publish push origin HEAD:refs/heads/web-build
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: oot-web-tested
          path: site
          retention-days: 14
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: smoke
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
