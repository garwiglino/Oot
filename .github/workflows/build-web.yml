name: Compiler et publier le jeu web

# Compile the pinned engine. test-web.yml validates and publishes the resulting artifact.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-web.yml'
      - 'patches/**'
      - 'scripts/web/**'
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a build in progress: a new push waits for the running one to finish.
concurrency:
  group: web-engine-build
  cancel-in-progress: false

env:
  # Ship of Harkinian web fork (Emscripten/WebGL, touch controls, in-browser ROM extraction)
  SOH_REPO: https://github.com/zalo/Shipwright
  SOH_COMMIT: f81ff64afdd8e0489237bd03c6b026582f6dc70d
  EMSDK_VERSION: 3.1.64
  BUILD_JOBS: 3

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      # The previous run was killed mid-build ("runner has received a shutdown signal"),
      # possibly due to memory pressure in large randomizer sources. Add swap
      # and compile heavy translation units sequentially to reduce peak memory.
      - name: Libérer de l'espace disque et ajouter de la mémoire swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile
          sudo fallocate -l 12G /swapfile-build
          sudo chmod 600 /swapfile-build
          sudo mkswap /swapfile-build
          sudo swapon /swapfile-build
          free -h
          df -h /

      - name: Récupérer les sources de Ship of Harkinian
        run: |
          git init -q soh-src
          git -C soh-src remote add origin "$SOH_REPO"
          git -C soh-src fetch -q --depth 1 origin "$SOH_COMMIT"
          git -C soh-src checkout -q FETCH_HEAD
          git -C soh-src submodule update --init --depth 1
          git -C soh-src apply "$GITHUB_WORKSPACE/patches/web-mobile-perf.patch"

      - name: Installer Ninja
        run: sudo apt-get update -q && sudo apt-get install -y -q ninja-build

      - name: Installer Emscripten
        run: |
          git clone -q --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install "$EMSDK_VERSION"
          "$HOME/emsdk/emsdk" activate "$EMSDK_VERSION"

      # No EM_COMPILER_WRAPPER=ccache: it broke CMake's FindThreads check (run 3).
      - name: Compiler en WebAssembly
        working-directory: soh-src
        run: |
          set -o pipefail
          source "$HOME/emsdk/emsdk_env.sh"
          ( while sleep 60; do
              free -m | awk 'NR==2{printf "[mem] used=%sMB available=%sMB", $3, $7} NR==3{printf " swap=%sMB\n", $3}'
            done ) &
          emcmake cmake -B build-web -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_REMOTE_CONTROL=OFF \
            -DUSE_OPENGLES=ON \
            -DINCLUDE_MPQ_SUPPORT=ON \
            -DGFX_DEBUG_DISASSEMBLER=OFF \
            -DSUPPRESS_WARNINGS=ON
          # The randomizer data tables need ~8 GB of RAM each at -O1/-O2: build them one at a
          # time first (-O0 is not an option: its 50k+ locals per function break the wasm link).
          HEAVY=$(ninja -C build-web -t targets all | grep -o -E '^soh/CMakeFiles/soh\.dir/soh/Enhancements/randomizer/(3drando/hint_list[^:]*|ShufflePots|item_list|location_list|settings)\.cpp\.o' | sort -u)
          test -n "$HEAVY" || { echo 'No heavy compilation targets found'; exit 1; }
          echo "$HEAVY"
          emmake ninja -C build-web -j1 $HEAVY 2>&1 | tee build-heavy.log
          emmake cmake --build build-web --target soh -j"$BUILD_JOBS" 2>&1 | tee build-main.log

      - name: Assembler le site
        run: |
          out=soh-src/build-web/soh
          ls -la "$out"
          mkdir -p site
          cp "$out/soh.html" site/index.html
          cp "$out/soh.js" "$out/soh.wasm" "$out/soh.data" site/
          if [ -f "$out/soh.o2r" ]; then cp "$out/soh.o2r" site/; else cp soh-src/soh/soh/web/soh.o2r site/; fi
          touch site/.nojekyll
          ls -la site

      - name: Vérifier les fichiers et le module WebAssembly
        run: |
          for file in index.html soh.js soh.wasm soh.data soh.o2r; do
            test -s "site/$file" || { echo "Missing or empty file: $file"; exit 1; }
          done
          node -e "WebAssembly.compile(require('fs').readFileSync('site/soh.wasm')).then(() => console.log('WASM compilation OK')).catch(e => { console.error(e); process.exit(1); })"
          sha256sum site/* > site/SHA256SUMS.txt

      - name: Conserver le site compilé
        uses: actions/upload-artifact@v4
        with:
          name: oot-web-site
          path: site
          retention-days: 14
          if-no-files-found: error

      - name: Conserver les journaux de compilation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oot-web-build-logs
          path: |
            soh-src/build-*.log
            soh-src/build-web/CMakeFiles/CMakeConfigureLog.yaml
          retention-days: 14
